[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-watch-challenge-radar"
version = "0.1.0"
description = "Monitor Apple Watch Limited Edition Challenges and publish ICS calendars and change notifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
keywords = ["apple-watch", "calendar", "ics", "mobileasset", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "icalendar>=5.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/skyrocketingHong/AppleWatchChallengeRadar"
Repository = "https://github.com/skyrocketingHong/AppleWatchChallengeRadar"
Issues = "https://github.com/skyrocketingHong/AppleWatchChallengeRadar/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
challenge-radar = "challenge_radar.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
challenge_radar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
